name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: validate brain structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required files present
        run: |
          set -e
          test -f README.md
          test -f _templates/YY-MM-DD-HAR.md
          test -f _templates/YY-MM-DD-HAR-compact.md
          echo "core files present"

      - name: Detailed log filenames are YY-MM-DD-HAR.md
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            base=$(basename "$f")
            if ! echo "$base" | grep -Eq '^[0-9]{2}-[0-9]{2}-[0-9]{2}-HAR\.md$'; then
              echo "::error file=$f::detailed log must be named YY-MM-DD-HAR.md"
              bad=1
            fi
          done < <(find projects -type f -name '*-HAR.md')
          exit $bad

      - name: Compact rollup filenames are YY-MM-DD-HAR-compact.md
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            base=$(basename "$f")
            if ! echo "$base" | grep -Eq '^[0-9]{2}-[0-9]{2}-[0-9]{2}-HAR-compact\.md$'; then
              echo "::error file=$f::compact rollup must be named YY-MM-DD-HAR-compact.md"
              bad=1
            fi
          done < <(find projects -type f -name '*-HAR-compact.md')
          exit $bad

      - name: Every brain is numbered, has a README and exactly one compact rollup
        run: |
          set -e
          bad=0
          for b in projects/*/; do
            [ -d "$b" ] || continue
            name=$(basename "$b")
            if ! echo "$name" | grep -Eq '^brain-[0-9]+$'; then
              echo "::error::brain folder must be named brain-<n>: $b"
              bad=1
            fi
            if [ ! -f "${b}README.md" ]; then
              echo "::error::missing ${b}README.md"
              bad=1
            fi
            n=$(find "$b" -maxdepth 1 -type f -name '*-HAR-compact.md' | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "::error::brain $name must have exactly one compact rollup (found $n)"
              bad=1
            fi
          done
          exit $bad

      - name: Every repo folder inside a brain has a README index
        run: |
          set -e
          bad=0
          for d in projects/*/*/; do
            [ -d "$d" ] || continue
            if [ ! -f "${d}README.md" ]; then
              echo "::error::missing ${d}README.md"
              bad=1
            fi
          done
          exit $bad

  validate-entries:
    name: validate entry content
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Unit-test the validator's pure functions
        run: npm test
      - name: Check required fields and cross-references
        run: npm run validate

  stack-template-drift:
    name: harness-stack mirror parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone harness-stack (best effort)
        id: clone
        continue-on-error: true
        env:
          # Compare against the matching branch (a companion PR's changes
          # live on a same-purpose branch pre-merge, though — since each
          # repo's branch name is generated independently — not always a
          # same-named one); fall back to the default branch otherwise, and
          # record which happened so the verify step below knows how much
          # to trust a drift finding.
          STACK_BRANCH: ${{ github.head_ref || github.ref_name }}
          STACK_URL: https://github.com/exponen-agi/harness-stack.git
        run: |
          set -e
          if git clone --depth 1 --branch "$STACK_BRANCH" "$STACK_URL" "$RUNNER_TEMP/harness-stack"; then
            echo "exact_branch=true" >> "$GITHUB_OUTPUT"
          else
            git clone --depth 1 "$STACK_URL" "$RUNNER_TEMP/harness-stack"
            echo "exact_branch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify this repo matches harness-stack's templates/brain mirror
        env:
          STACK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ ! -d "$RUNNER_TEMP/harness-stack" ]; then
            echo "::notice::harness-stack not reachable from CI — skipping drift check. Run \`npm run verify:stack-template\` locally against a sibling checkout."
            exit 0
          fi
          if node scripts/check-stack-template-drift.mjs "$RUNNER_TEMP/harness-stack"; then
            exit 0
          fi
          if [ "${{ steps.clone.outputs.exact_branch }}" = "true" ]; then
            echo "::error::this repo has drifted from the same-named companion branch on harness-stack — see the comparison above."
            exit 1
          fi
          echo "::warning::this repo differs from harness-stack's default branch, but no branch named '$STACK_BRANCH' exists there to compare against instead — expected while a companion PR with a different branch name is still open on harness-stack. Not failing the build; this gets a real comparison once branch names line up or the companion PR merges. Verify by hand with \`npm run verify:stack-template\` against the actual companion checkout."
